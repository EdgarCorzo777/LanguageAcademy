version: "3.8"

services:
  lingo-assistant:
    build: .
    container_name: lingo-admissions-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-3.5-flash-lite}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - CACHE_ENABLED=true
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./database:/app/database
